name: Python unit tests

on:
  push:
    branches:
      - main
      - "test/**"
      - "feature/**"
      - "fix/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    name: Run safe unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install test runner
        run: python -m pip install --upgrade pip pytest

      - name: Run unit tests
        run: python -m pytest -q
